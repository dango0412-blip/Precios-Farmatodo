name: Actualizar precios

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Descargar precios y generar la app
        run: python recolector.py --salida docs/index.html
      - name: Guardar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actualizador@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F)"
          git push
